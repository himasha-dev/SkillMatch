# SkillMatch CI/CD - runs automatically on every push and pull request.
# Jobs: unit+API tests with coverage -> client build -> integration + BDD (real MongoDB)
#       -> Selenium UI tests -> JMeter load test -> SonarQube/SonarCloud analysis.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JWT_SECRET: ci-only-jwt-secret-not-for-production

jobs:
  unit-api-tests:
    name: Unit + API tests (coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run unit + API tests with coverage
        run: npm run test:coverage | tee test-output.txt
      - name: Publish coverage table to the run summary
        if: always()
        run: |
          echo '### Server test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(ℹ|#) (tests|pass|fail)' test-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: |
            server/coverage/
            server/test-output.txt

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  integration-bdd:
    name: Integration (real MongoDB) + BDD (Cucumber)
    runs-on: ubuntu-latest
    needs: unit-api-tests
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Integration tests against MongoDB
        working-directory: server
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/skillmatch_it
        run: npm run test:integration
      - name: Install QA tools (Cucumber, Selenium)
        working-directory: qa
        run: npm install --no-audit --no-fund
      - name: Run Cucumber BDD scenarios
        working-directory: qa
        run: npx cucumber-js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: qa/reports/

  e2e-selenium:
    name: UI automation (Selenium + Chrome)
    runs-on: ubuntu-latest
    needs: [unit-api-tests, client-build]
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017/skillmatch_e2e
      CLIENT_URL: http://localhost:4173
      PORT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Start API with seed data
        working-directory: server
        run: |
          npm ci
          npm run seed
          nohup npm start > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && break; sleep 1; done
      - name: Build and serve client
        working-directory: client
        env:
          VITE_API_URL: http://localhost:5000/api
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
      - name: Run Selenium tests
        working-directory: qa
        env:
          BASE_URL: http://localhost:4173
        run: |
          npm install --no-audit --no-fund
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-evidence
          path: |
            qa/reports/screenshots/
            server.log
            preview.log

  performance-jmeter:
    name: Load test (JMeter)
    runs-on: ubuntu-latest
    needs: unit-api-tests
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017/skillmatch_perf
      PORT: "5000"
      JMETER_VERSION: "5.6.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Start API with seed data
        working-directory: server
        run: |
          npm ci
          npm run seed
          nohup npm start > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && break; sleep 1; done
      - name: Install Apache JMeter
        run: |
          curl -sSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" | tar -xz
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Run load test (50 users, 30 s ramp-up, 120 s)
        run: |
          jmeter -n -t performance/skillmatch-load-test.jmx \
            -Jhost=localhost -Jport=5000 -Jusers=50 -Jrampup=30 -Jduration=120 \
            -l performance/results/results.jtl -e -o performance/results/html-report
      - name: Summarise results
        if: always()
        run: python3 performance/summarize_jtl.py performance/results/results.jtl | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-results
          path: |
            performance/results/
            server.log

  sonar:
    name: SonarQube / SonarCloud analysis
    runs-on: ubuntu-latest
    needs: unit-api-tests
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate coverage for Sonar
        working-directory: server
        run: npm ci && npm run test:coverage
      - name: Skip notice (no token configured)
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN secret not set - add it in Settings > Secrets > Actions to enable the scan."
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
