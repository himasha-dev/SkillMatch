# SonarQube / SonarCloud configuration for SkillMatch
# SonarCloud: import the GitHub repo at sonarcloud.io, then check the two keys below match
# what SonarCloud shows (Administration > Update key). Self-hosted SonarQube: set the
# SONAR_HOST_URL secret (e.g. http://your-server:9000) and ignore sonar.organization.
sonar.projectKey=himasha-dev_SkillMatch
sonar.organization=himasha-dev
sonar.projectName=SkillMatch
sonar.projectVersion=1.0.0

sonar.sources=server/src,client/src
sonar.tests=server/tests,qa
sonar.test.inclusions=server/tests/**/*.js,qa/**/*.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**
sonar.sourceEncoding=UTF-8

# Coverage from: cd server && npm run test:coverage
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
# The React client has no unit tests (covered by Selenium); exclude it from coverage %
sonar.coverage.exclusions=client/**,server/src/index.js,server/scripts/**
